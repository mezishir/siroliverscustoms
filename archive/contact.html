      <h2>Request a Commission</h2>
      <form class="contact-form" action="mailto:siroliverscustoms@email.com" method="POST" enctype="text/plain">
        <label for="name">Name:</label><br>

        <textarea id="message" name="message" rows="6" required></textarea><br><br>
        <button type="submit">Send Request</button>
      </form>
      <p style="margin-top:2em; color:#ffd700;">Or email me directly: <a href="mailto:siroliverscustoms@email.com">siroliverscustoms@email.com</a></p>
